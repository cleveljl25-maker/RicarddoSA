<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Ricardo Santos S.A. — Registro de Apiladoras</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="app">

  <!-- ===== SIDEBAR IZQUIERDA ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">RS</div>
      <div class="brand-title">
        <h1>Ricardo Santos S.A.</h1>
        <p>Registro de mantenimiento</p>
      </div>
    </div>

    <!-- ALERTAS -->
    <div style="margin-top:24px">
      <div class="small">Alertas próximas</div>
      <div class="alerts" id="alertsBox">
        <div class="muted" style="padding:8px">No hay alertas</div>
      </div>
    </div>

    <div class="small" style="margin-top:auto">
      Última sincronización:
      <span id="lastSync">—</span>
    </div>
  </aside>

  <!-- ===== PANEL PRINCIPAL ===== -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="card topbar">
      <div>
        <div class="title">Panel Principal</div>
        <div class="muted">Gestión de apiladoras y mantenimiento</div>
      </div>
      <div style="text-align:right">
        <div class="muted">Usuario: <strong>Ricardo</strong></div>
        <div class="muted">Fecha: <span id="today"></span></div>
      </div>
    </div>

    <!-- ===== CONTENIDO CENTRAL ===== -->
    <div class="content">

      <!-- PANEL DERECHO LIMPIO -->
      <section class="card" style="
        flex:1;
        display:flex;
        align-items:center;
        justify-content:center;
      ">

        <div style="
          display:flex;
          flex-direction:column;
          gap:18px;
          width:320px;
          text-align:center;
        ">

          <!-- BOTÓN BUSCAR -->
          <button class="btn" onclick="document.getElementById('globalSearch').focus()">
            🔍 Buscar Apiladora
          </button>

          <!-- BOTÓN LISTA -->
          <button class="btn" onclick="document.getElementById('leftPane').scrollIntoView({behavior:'smooth'})">
            📋 Lista de Apiladoras
          </button>

          <!-- BOTÓN ALERTAS -->
          <button class="btn" onclick="document.getElementById('alertsBox').scrollIntoView({behavior:'smooth'})">
            ⏰ Alertas de Mantenimiento
          </button>

        </div>

      </section>

      <!-- ===== PANEL LISTA (OCULTO VISUALMENTE, NO FUNCIONALMENTE) ===== -->
      <section class="list card" id="leftPane" style="display:none">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <strong>Apiladoras</strong>
          <div class="muted">Total: <span id="totalCount">0</span></div>
        </div>

        <div id="apList"></div>

      </section>

    </div>

    <footer class="muted">
      Diseñado y creado por <strong>Clevel JL</strong>.
    </footer>

  </main>

</div>

<!-- INPUT OCULTO PARA BUSCAR (LO USA EL SCRIPT) -->
<input id="globalSearch" style="display:none" />

<script type="module" src="script.js"></script>
</body>
</html>
